
name: Build VectorCraft for Intel Mac

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build VectorCraft
        run: cargo build --release --locked --workspace --target x86_64-apple-darwin

      - name: Show build files
        run: |
          echo "Build completed. Available executables:"
          ls -lah target/x86_64-apple-darwin/release/

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-macos-intel-build
          path: target/x86_64-apple-darwin/release/
          if-no-files-found: error
          retention-days: 14
